name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Every version the manifest claims to support. A package that says `php: ^8.1` and is
    # only ever run on 8.4 is making a promise nobody checks.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      # No lock file on purpose: this is a library, so what matters is that it works with
      # the dependencies an application would actually resolve today.
      - run: composer update --no-interaction --prefer-dist

      - run: composer test
